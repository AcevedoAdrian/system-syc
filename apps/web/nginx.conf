# Única entrada HTTP del sistema (SPEC 07): sirve la SPA y reenvía `/api` a la API.
# Se instala como `/etc/nginx/conf.d/default.conf`.

# DNS de Docker. `proxy_pass` con una variable lo consulta en cada request (cada `valid`), no una sola
# vez al arrancar: recrear solo `api` le cambia la IP y Nginx la sigue sin reiniciarse.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Las cabeceras van a nivel server y ninguna `location` define `add_header` propios
  # (si alguna lo hiciera, dejaría de heredar estas).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  set $api http://api:3000;

  # Compartido por las dos rutas de la API. `X-Real-IP` pisa el que mande el cliente: es la IP que usa
  # el rate limit del login (`advanced.ipAddress.ipAddressHeaders` en `auth.config.ts`).
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Better Auth: la ruta pasa intacta (`/api/auth/*` es su `basePath`). Sin URI en `proxy_pass`, Nginx
  # manda la ruta original tal cual.
  location /api/auth/ {
    proxy_pass $api;
  }

  # El resto de la API pierde el prefijo: `/api/tickets` → `/tickets`.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
  }

  # Un archivo del build, o `index.html` (rutas de la SPA, como recargar `/tickets/abc`).
  location / {
    try_files $uri /index.html;
  }
}
