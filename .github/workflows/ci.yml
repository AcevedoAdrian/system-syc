name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Solo lo afectado respecto de main. En push a main compara contra el commit anterior.
      - name: Lint (repo completo)
        run: pnpm lint

      - name: Typecheck, test y build de lo afectado
        run: pnpm turbo typecheck test build --filter="...[${{ github.event_name == 'pull_request' && 'origin/' || '' }}${{ github.event_name == 'pull_request' && github.base_ref || 'HEAD^1' }}]"
