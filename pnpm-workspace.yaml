packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  prisma: true
overrides:
  '@modelcontextprotocol/sdk': 1.32.0
  hono: 4.13.11
  mysql2: 3.23.1
  # Avisos altos del 22 de octubre de 2026 en dependencias de dependencias: `multer` entra fijo desde
  # `@nestjs/platform-express` 12.2.0, `body-parser` desde `express` 5.3.0 y `undici` desde `jsdom`.
  # Se sacan cuando esos paquetes suban sus propias versiones (`pnpm why <paquete>`).
  body-parser: 2.4.0
  multer: 2.5.0
  'undici@^8.0.0': 8.12.2
  source-map-js: 1.2.2
  # Avisos altos del 29 de octubre de 2026 en `seroval` (deserialización de `@tanstack/router-core`, que lo
  # fija en 1.6.7). 1.6.12 es de la misma rama y corrige también los moderados. Se saca cuando
  # `@tanstack/router-core` suba su propia versión (`pnpm why seroval`).
  seroval: 1.6.12
  seroval-plugins: 1.6.12
# Una versión publicada hace menos de 3 días no se instala (los ataques de 2026 a TanStack y axios se
# detectaron en horas o días). Sin excepciones: si una versión nueva hace falta antes, se espera.
minimumReleaseAge: 4320
# Rechaza una versión sin la procedencia (publicador confiable o attestation) que sí tenían versiones
# publicadas antes: puede ser una toma de control del paquete. Las dos excepciones se revisaron a mano
# (octubre de 2026) y en ninguna cambió quién publica: `prisma@7.10.1` la publicó `prismabot`, igual que
# la 7.10.0, y `semver@6.3.1` es un parche de la rama 6 publicado después de la 7.5.4. Una excepción
# nueva se revisa igual, no se copia.
trustPolicy: no-downgrade
trustPolicyExclude:
  - prisma@7.10.1
  - semver@6.3.1
